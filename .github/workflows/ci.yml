name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Install exactly what uv.lock says. The cu128 torch wheels run on a CPU-only runner
  # (they simply report no CUDA device), so the lockfile is not overridden for CI.
  UV_FROZEN: "1"

jobs:
  lint:
    name: ruff + ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --group dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ty
        run: uv run ty check

  test:
    name: pytest ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # texture2ddecoder publishes no 3.13 wheels; pyproject pins <3.13.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev --python ${{ matrix.python }}
      - name: pytest with coverage
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: sdist + wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: build
        run: uv build
      - name: validate metadata
        run: uvx twine check dist/*
      - name: install the wheel into a clean environment and import it
        run: |
          uv venv --python 3.12 /tmp/clean
          # CPU torch keeps this step small; the wheel's own metadata pins nothing about the index.
          uv pip install --python /tmp/clean --index pytorch-cu128=https://download.pytorch.org/whl/cpu dist/*.whl
          /tmp/clean/bin/python -c "import clarity, clarity.cli, clarity.ffxiv, clarity.processing.roles; print(clarity.cli.__doc__)"
          /tmp/clean/bin/clarity where
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
